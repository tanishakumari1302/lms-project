<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart LMS</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="home-wrapper">
    <div class="home-header">
      <h1>Smart Learning Management System</h1>
      <p>One platform, three roles — choose your login.</p>
    </div>

    <div class="role-grid">
      <a href="index.html" class="role-card">
        <span class="role-icon">🎓</span>
        <h3>Student</h3>
        <p>Access courses, quizzes, assignments and grades.</p>
      </a>
      <a href="faculty-login.html" class="role-card">
        <span class="role-icon">🧑‍🏫</span>
        <h3>Faculty</h3>
        <p>Upload notes, make assignments, check attendance.</p>
      </a>
      <a href="admin-login.html" class="role-card">
        <span class="role-icon">🛠️</span>
        <h3>Admin</h3>
        <p>Manage students, faculty, and courses.</p>
      </a>
    </div>
  </div>
</body>
</html>
