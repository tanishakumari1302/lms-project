<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="navbar">
        <span class="brand">📚 MYLMS</span>
        <div>
            <a href="dashboard.html">Dashboard</a>

    <div class="page-content">
  <h2>Welcome back, <span id="studentNameSpan">Tanisha</span> 👋</h2>

      <span class="stat-number" id="statTotalCourses">-</span>

      <span class="stat-number" id="statCompleted">-</span>

      <span class="stat-number">2</span>
      <span class="stat-label">Pending Assignments</span>
    </div>
    <div class="stat-card">
      <span class="stat-number">85%</span>
      <span class="stat-label">Average Score</span>
    </div>
  </div>

  <h3 style="margin: 28px 0 14px;">My Courses</h3>

</div>
