<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-box">
    <h2>Faculty Login</h2>

    <input type="email" id="facultyEmail" placeholder="Enter Faculty Email" />
    <input type="password" id="facultyPassword" placeholder="Enter Password" />
    <button onclick="handleFacultyLogin()">Login</button>

    <p id="facultyErrorMsg" style="color: var(--danger); font-size: 13px; margin-top: 10px;"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
