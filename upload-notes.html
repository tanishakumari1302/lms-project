<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Notes</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="navbar">
        <span class="brand">📚 MyLMS Faculty</span>
        <div>
            <a href="faculty-dashboard.html">Dashboard</a>
            <a href="upload-notes.html">Upload Notes</a>
            <a href="create-assignment.html">Assignments</a>
            <a href="mark-attendance.html">Attendance</a>
            <button onclick="handleFacultyLogout()">Logout</button>
        </div>
    </nav>

    <div class="page-content">
        <h2>Upload Notes</h2>

        <div class="add-form">
            <select id="noteCourseSelect"></select>
            <input type="text" id="noteTitle" placeholder="Note Title (e.g. Chapter 1.pdf)" />
            <button onclick="uploadNote()">Upload</button>
        </div>

        <table id="notesTable">
            <tr>
                <th>Course</th>
                <th>Note Title</th>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
