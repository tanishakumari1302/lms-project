<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Faculty</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <nav class="navbar">
        <span class="brand">📚 MyLMS Admin</span>
        <div>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="manage-students.html">Students</a>
            <a href="manage-faculty.html">Faculty</a>
            <a href="manage-courses.html">Courses</a>
            <button onclick="handleAdminLogout()">Logout</button>
        </div>
    </nav>

    <div class="page-content">
        <h2>Manage Faculty</h2>

        <div class="add-form">
            <input type="text" id="newFacultyName" placeholder="Faculty Name" />
            <input type="email" id="newFacultyEmail" placeholder="Email" />
            <input type="text" id="newFacultySubject" placeholder="Subject" />
            <button onclick="addFaculty()">Add Faculty</button>
        </div>

        <table id="facultyTable">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Action</th>
            </tr>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
